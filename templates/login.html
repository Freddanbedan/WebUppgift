<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Logga in | Forum för fårskallar</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
  <main class="container login-container">
    <header class="page-header">
      <p class="eyebrow">PROGRAMMERING OCH DATA</p>
      <h1>Forum för fårskallar</h1>
      <p class="intro">Logga in på ditt konto</p>
    </header>

    {% if error %}<p class="error auth-error" role="alert">{{ error }}</p>{% endif %}
    {% with messages = get_flashed_messages() %}
      {% for message in messages %}<p class="notice">{{ message }}</p>{% endfor %}
    {% endwith %}

    <section class="form-box auth-box" aria-labelledby="login-heading">
      <h2 id="login-heading">Logga in</h2>
      <form method="post" action="{{ url_for('login') }}">
        <label for="login-username">Användarnamn</label>
        <input id="login-username" name="username" type="text" maxlength="30" autocomplete="username" required>
        <label for="login-password">Lösenord</label>
        <input id="login-password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Logga in</button>
      </form>
    </section>

    <p class="auth-switch">Har du inget konto? <a href="{{ url_for('register') }}">Skapa konto</a></p>
  </main>
</body>
</html>
